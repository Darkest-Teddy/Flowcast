<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowcast</title>
    <link rel="icon" href="/favicon.svg" />
    <meta
      name="description"
      content="Flowcast is a 3D map of Boston University where simulated students follow real class schedules, so you can see how crowded a dining hall, library or gym will be before you walk there."

    <!--
      Marketing faces, per DESIGN.md §2. Fraunces is the display serif (variable: opsz/SOFT/WONK

      reserved for literal live numbers only. The dashboard still runs on the system stacks in
      theme/tokens.css -- these load for the landing page and cost nothing elsewhere.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Space+Grotesk:wght@400..700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
