name: Simulation accuracy checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: map-client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r data-pipeline/requirements.txt
      - run: npm ci
        working-directory: map-client
      - run: python -m unittest discover -s tests
        working-directory: data-pipeline
      - run: npm run build
        working-directory: map-client
      - run: npm test
        working-directory: map-client
