name: CI

# Manual only: start a run from the Actions tab ("Run workflow"). Pushes and pull requests no
# longer run it automatically; to turn that back on, add `push: { branches: [main] }` and `pull_request:`.
on:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '26'
  PYTHON_VERSION: '3.12'

jobs:
  data-pipeline:
    name: Data pipeline (Python tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt
      - run: python -m pip install -r data-pipeline/requirements.txt
      - run: python -m unittest discover -s tests
        working-directory: data-pipeline

  map-client:
    name: Map client (build, tests, data drift)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: map-client/package-lock.json
      # `npm run build` regenerates map data through the Python pipeline first.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt
      - run: python -m pip install -r data-pipeline/requirements.txt
      - run: npm ci
        working-directory: map-client
      - run: npm run build
        working-directory: map-client
      - run: npm test
        working-directory: map-client
      # event-impact.json is excluded: its build reads today's date, so it changes day to day.
      - name: Committed map data matches the pipeline output
        run: |
          if ! git diff --exit-code --stat -- . ':(exclude)map-client/public/data/event-impact.json'; then
            echo "::error::Generated data differs from what is committed. Run 'npm run prepare:data' in map-client and commit the result."
            exit 1
          fi

  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            map-client/package-lock.json
      # web serves the map at /map and imports map-client's sources and node_modules.
      - run: npm ci
        working-directory: map-client
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npx vite build
        working-directory: web

  server:
    name: Server (typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Skips cleanly until the server package is committed.
      - id: present
        run: echo "found=${{ hashFiles('server/package-lock.json') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: steps.present.outputs.found == 'true'
        run: npm ci
        working-directory: server
      - if: steps.present.outputs.found == 'true'
        run: npm run typecheck
        working-directory: server
      - if: steps.present.outputs.found == 'true'
        run: npm test
        working-directory: server
